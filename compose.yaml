services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clouddeploy-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/proshop
      - JWT_SECRET=mysecretkey12345
      - PAYPAL_CLIENT_ID=sb
    depends_on:
      - mongo
    networks:
      - proshop-network

  mongo:
    image: mongo:latest
    container_name: clouddeploy-mongo
    restart: always
    volumes:
      - mongo-data:/data/db
    networks:
      - proshop-network

volumes:
  mongo-data:
    driver: local

networks:
  proshop-network:
    driver: bridge
